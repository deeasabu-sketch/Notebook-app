<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · Secure Notes</title><link rel="stylesheet" href="/css/style.css"><script defer src="/js/api.js"></script><script defer src="/js/auth.js"></script></head><body><header class="navbar"><a class="brand" href="/">Secure Notes</a><a href="/login.html">Log in</a></header><main class="narrow"><section class="card"><h1>Create your account</h1><p data-message class="message" aria-live="polite"></p><form data-auth="register"><label>Name<input name="name" required minlength="2" maxlength="100" autocomplete="name"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" required minlength="8" autocomplete="new-password"></label><label>Interests <span class="muted">(comma separated, optional)</span><input name="interests" placeholder="reading, chess"></label><button type="submit">Register</button></form></section></main></body></html>
