<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your notebook · Secure Notes</title><link rel="stylesheet" href="/css/style.css"><script defer src="/js/api.js"></script><script defer src="/js/dashboard.js"></script></head><body><header class="navbar"><a class="brand" href="/">Secure Notes</a><div class="actions"><a href="/public-posts.html">Public posts</a><span>Hello, <strong data-name></strong></span><button data-logout class="secondary">Log out</button></div></header><main class="container"><h1>Your notebook</h1><p data-message class="message" aria-live="polite"></p><section class="card"><h2>New note</h2><form data-note-form><label>Title<input name="title" required maxlength="200"></label><label>Content<textarea name="content" required rows="5"></textarea></label><button type="submit">Save note</button></form></section><section><h2>Your notes</h2><div class="grid" data-notes>Loading notes…</div><div class="actions pager"><button data-notes-prev class="secondary">Previous</button><span data-notes-page></span><button data-notes-next class="secondary">Next</button></div></section><section class="card"><h2>Share a public post</h2><p class="muted">Posts are visible to everyone.</p><form data-post-form><label>Title<input name="title" required></label><label>Content<textarea name="content" required rows="3"></textarea></label><button type="submit">Publish post</button></form></section></main></body></html>
