<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Secure Notes</title><link rel="stylesheet" href="/css/style.css"><script defer src="/js/api.js"></script><script defer src="/js/admin.js"></script></head><body><header class="navbar"><a class="brand" href="/">Secure Notes · Admin</a><button data-logout class="secondary">Log out</button></header><main class="container"><h1>Administration</h1><p data-message class="message" aria-live="polite"></p><section class="card"><h2>Create user</h2><form data-create-user class="form-grid"><label>Name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="8" required></label><label>Role<select name="role"><option value="user">User</option><option value="admin">Admin</option></select></label><label>Interests<input name="interests" placeholder="reading, chess"></label><button type="submit">Add user</button></form></section><section><h2>Users</h2><div data-users class="card stack">Loading users…</div><div class="actions pager"><button data-prev class="secondary">Previous</button><span data-page></span><button data-next class="secondary">Next</button></div></section><section class="card"><h2>Users grouped by interest</h2><div data-groups class="grid"></div><div class="actions pager"><button data-groups-prev class="secondary">Previous</button><span data-groups-page></span><button data-groups-next class="secondary">Next</button></div></section><section class="card"><h2>All notes</h2><div data-admin-notes class="stack">Loading notes…</div><div class="actions pager"><button data-notes-prev class="secondary">Previous</button><span data-notes-page></span><button data-notes-next class="secondary">Next</button></div></section><section class="card"><h2>Public posts by user</h2><form data-inspect class="inline-form"><label>User ID<input name="id" required placeholder="MongoDB user ID"></label><button type="submit">View posts</button></form><div data-posts class="stack"></div></section></main></body></html>
